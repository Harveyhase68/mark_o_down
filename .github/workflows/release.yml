# Builds the Windows installer and creates a GitHub release when a version tag is pushed:
#
#   npm run release:version 0.2.0
#   git commit -am "Release v0.2.0"
#   git tag v0.2.0
#   git push origin main v0.2.0
#
# The release is created as a draft: check it on GitHub, add notes, then "Publish release".
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Tag matches the app version
        run: node scripts/set-version.mjs --check ${{ env.TAG }}

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build installer and create release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Mark O Down ${{ env.TAG }}
          releaseDraft: true
          prerelease: ${{ contains(env.TAG, '-') }}
          uploadUpdaterJson: false
          releaseBody: |
            ## Download

            **`Mark.O.Down_*_x64-setup.exe`** below – Windows 10/11, 64-bit.

            The installer is not code-signed yet: if Windows SmartScreen shows
            "Windows protected your PC", click **More info → Run anyway**.

            ## Changes

            - …
