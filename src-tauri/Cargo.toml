[package]
name = "mark_o_down"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Alexander Predl"]

[dependencies]
tauri = { version = "2.12.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
ureq = "3"

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
