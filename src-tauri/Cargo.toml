[package]
name = "mark_o_down"
version = "0.6.0"
edition = "2024"
license = "MIT"
authors = ["Alexander Predl"]

[dependencies]
tauri = { version = "2.12.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
ureq = "3"
base64 = "0.22"
# spell checking on Linux (Hunspell dictionaries); pure Rust, also used by the tests
spellbook = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
# spell checking: NSSpellChecker (the versions Tauri already uses)
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
# "Save as PDF" (WebView2 PrintToPdf) – the versions Tauri's webview (wry) uses
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Globalization", "Win32_System_Com"] }
